<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foto con Realidad Aumentada</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; }
      #aviso-audio {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.7); color: white; padding: 10px 18px;
        border-radius: 20px; font-size: 14px; z-index: 999; pointer-events: none;
      }
      #error-msg {
        display: flex; justify-content: center; align-items: center;
        height: 100vh; text-align: center; padding: 20px; color: #333;
      }
    </style>
  </head>
  <body>
    <script>
      // 1. Leer parámetros: ?id=carpeta&total=3&ratio=1&max=2
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const total = parseInt(params.get('total') || '1', 10);
      const ratio = params.get('ratio') || '1';
      // Cuántas fotos se pueden reproducir al mismo tiempo (por defecto 2 en paquetes, 1 en individual)
      const maxTrack = parseInt(params.get('max') || (total > 1 ? '2' : '1'), 10);

      if (!id) {
        document.body.innerHTML = `
          <div id="error-msg">
            <h2>Falta el identificador del proyecto</h2>
          </div>`;
      } else {
        const rutaMind = `./${id}/targets.mind`;
        let assetsHTML = '';
        let targetsHTML = '';

        // 2. Generar dinámicamente los videos y marcadores
        for (let i = 0; i < total; i++) {
          const nombreVideo = total === 1 ? 'video.mp4' : `video${i + 1}.mp4`;
          const rutaVideo = `./${id}/${nombreVideo}`;

          assetsHTML += `
            <video
              id="mi-video-${i}"
              src="${rutaVideo}"
              preload="auto"
              loop="true"
              muted="true"
              playsinline
              webkit-playsinline
              crossorigin="anonymous"
            ></video>
          `;

          targetsHTML += `
            <a-entity id="marcador-${i}" mindar-image-target="targetIndex: ${i}">
              <a-video
                class="plano-video"
                src="#mi-video-${i}"
                position="0 0 0"
                width="1"
                height="${ratio}"
                rotation="0 0 0"
              ></a-video>
            </a-entity>
          `;
        }

        // 3. Inyectar la escena completa
        document.body.innerHTML = `
          <div id="aviso-audio">Toca la pantalla para activar el sonido</div>

          <a-scene
            mindar-image="imageTargetSrc: ${rutaMind}; maxTrack: ${maxTrack};"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
          >
            <a-assets>${assetsHTML}</a-assets>
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            ${targetsHTML}
          </a-scene>
        `;

        // 4. Conectar reproducción y audio para cada foto del paquete
        const aviso = document.querySelector('#aviso-audio');
        const videos = [];
        const visibles = new Array(total).fill(false);

        for (let i = 0; i < total; i++) {
          const marcador = document.querySelector(`#marcador-${i}`);
          const video = document.querySelector(`#mi-video-${i}`);
          videos.push(video);

          marcador.addEventListener('targetFound', () => {
            visibles[i] = true;
            video.play();
          });

          marcador.addEventListener('targetLost', () => {
            visibles[i] = false;
            video.pause();
          });
        }

        document.body.addEventListener('click', () => {
          videos.forEach((video, i) => {
            video.muted = false;
            if (visibles[i]) video.play();
          });
          aviso.style.display = 'none';
        });

        // 5. Zoom con pellizco (dos dedos) sobre los videos
        const planos = document.querySelectorAll('.plano-video');
        let distanciaInicial = 0;
        let escalaActual = 1;

        document.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            distanciaInicial = Math.hypot(
              e.touches[0].pageX - e.touches[1].pageX,
              e.touches[0].pageY - e.touches[1].pageY
            );
          }
        });

        document.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2 && distanciaInicial > 0) {
            const distanciaActual = Math.hypot(
              e.touches[0].pageX - e.touches[1].pageX,
              e.touches[0].pageY - e.touches[1].pageY
            );
            const factor = distanciaActual / distanciaInicial;
            const nuevaEscala = Math.min(Math.max(escalaActual * factor, 1), 3);
            planos.forEach((plano) => {
              plano.setAttribute('scale', `${nuevaEscala} ${nuevaEscala} 1`);
            });
          }
        });

        document.addEventListener('touchend', (e) => {
          if (e.touches.length < 2) {
            const scale = planos[0]?.getAttribute('scale');
            if (scale) escalaActual = scale.x;
            distanciaInicial = 0;
          }
        });
      }
    </script>
  </body>
</html>
